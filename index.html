<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple real-time group chat.">
  <title>GroupChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-card" aria-label="GroupChat">
      <header class="topbar">
        <div>
          <p class="eyebrow">PUBLIC ROOM</p>
          <h1>GroupChat</h1>
        </div>
        <div id="connection-status" class="status" role="status">Connecting…</div>
      </header>

      <div id="setup-notice" class="notice hidden" role="alert"></div>
      <div id="messages" class="messages" aria-live="polite" aria-label="Messages">
        <p class="empty-state">Loading messages…</p>
      </div>

      <form id="message-form" class="composer" autocomplete="off">
        <label class="sr-only" for="message-input">Message</label>
        <input id="message-input" maxlength="500" placeholder="Write a message…" disabled>
        <button type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <dialog id="name-dialog" class="name-dialog">
    <form id="name-form" method="dialog">
      <h2>Join GroupChat</h2>
      <p>Your name is saved securely in the shared database, so it works on all your devices.</p>
      <label for="name-input">Display name</label>
      <input id="name-input" name="name" maxlength="40" minlength="1" required autocomplete="name" placeholder="e.g. Alex">
      <button type="submit">Join chat</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
