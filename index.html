<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="A real-time public group chat.">
  <title>GroupChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261001">
</head>
<body>
  <main class="app-shell">
    <section class="chat-card" aria-label="GroupChat">
      <header class="topbar">
        <div>
          <p class="eyebrow">PUBLIC ROOM</p>
          <h1>GroupChat</h1>
        </div>
        <div id="connection-status" class="status" role="status">Starting Supabase…</div>
      </header>
      <div id="setup-notice" class="notice hidden" role="alert"></div>
      <div id="messages" class="messages" aria-live="polite">
        <p class="empty-state">Connecting to the shared chat…</p>
      </div>
      <form id="message-form" class="composer" autocomplete="off">
        <label class="sr-only" for="message-input">Message</label>
        <input id="message-input" type="text" maxlength="500" placeholder="Write a message…" disabled>
        <button type="submit" disabled>Send</button>
      </form>
    </section>
  </main>
  <dialog id="name-dialog" class="name-dialog">
    <form id="name-form">
      <h2>Join GroupChat</h2>
      <p>Your name is saved in the shared Supabase database.</p>
      <label for="name-input">Display name</label>
      <input id="name-input" name="name" type="text" maxlength="40" minlength="1" autocomplete="name" placeholder="e.g. Alex" required>
      <button type="submit">Join chat</button>
    </form>
  </dialog>
  <script type="module" src="app.js?v=20261001"></script>
</body>
</html>
