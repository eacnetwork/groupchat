<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ts for luh gc"
    />
    <title>jewish groupchat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="hide">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">G</div>
          <div>
            <p class="eyebrow">for jews</p>
            <h1>GC</h1>
          </div>
        </div>

        <div class="user-card">
          <div class="avatar">A</div>
          <div>
            <p class="label">Signed in</p>
            <strong id="current-user-name">Loading…</strong>
            <span id="current-user-email"></span>
          </div>
        </div>

        <button id="logout-button" class="logout-button" type="button">
          log out luh boi
        </button>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="eyebrow">jewish users only</p>
            <h2>private planning discussions</h2>
          </div>
        </header>

        <div id="notice" class="notice hidden" aria-live="polite"></div>
        <div id="messages" class="messages" aria-live="polite"></div>

        <div class="composer-wrap">
          <div class="attachment-row">
            <label class="attachment-button" for="image-upload">el image</label>
            <label class="attachment-button" for="camera-upload">el photo</label>
            <button id="voice-toggle" class="attachment-button" type="button">
              el voice note
            </button>
          </div>

          <div class="composer-tools">
            <input id="image-upload" type="file" accept="image/*" hidden />
            <input
              id="camera-upload"
              type="file"
              accept="image/*"
              capture="environment"
              hidden
            />
          </div>

          <form id="composer-form" class="composer">
            <textarea
              id="message-input"
              rows="1"
              placeholder="send your plan..."
              maxlength="1000"
            ></textarea>
            <button type="submit" class="send-button">Send</button>
          </form>
        </div>
      </main>
    </div>

    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand-mark large">G</div>
          <h2>jews gc</h2>
          <p>approved jews only</p>
        </div>

        <form id="auth-form" class="auth-form">
          <label>
            <span>el email</span>
            <input
              id="email-input"
              type="email"
              placeholder="jews@jews.jew"
              autocomplete="email"
              required
            />
          </label>

          <label>
            <span>el pass</span>
            <input
              id="password-input"
              type="password"
              placeholder="Create or enter your password"
              autocomplete="current-password"
              required
            />
          </label>

          <button type="submit" class="primary-button">Continue</button>
        </form>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
