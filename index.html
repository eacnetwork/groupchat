<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;"><meta name="description" content="Private group chat for approved users only" />
    <title>Private GroupChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="hide">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">G</div>
          <div>
            <p class="eyebrow">Private room</p>
            <h1>GroupChat</h1>
          </div>
        </div>

        <div class="user-card">
          <div class="avatar">{{initials}}</div>
          <div>
            <p class="label">Signed in</p>
            <strong id="current-user-name">Loading…</strong>
            <span id="current-user-email"></span>
          </div>
        </div>

        <button id="logout-button" class="logout-button" type="button">Log out</button>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Approved users only</p>
            <h2>Private discussions</h2>
          </div>
        </header>

        <div id="notice" class="notice hidden" aria-live="polite"></div>
        <div id="messages" class="messages" aria-live="polite"></div>

        <div class="composer-wrap">
          <div class="attachment-row">
            <label class="attachment-button" for="image-upload">Image</label>
            <label class="attachment-button" for="camera-upload">Photo</label>
            <button id="voice-toggle" class="attachment-button" type="button">Voice note</button>
          </div>

          <div class="composer-tools">
            <input id="image-upload" type="file" accept="image/*" hidden />
            <input id="camera-upload" type="file" accept="image/*" capture="environment" hidden />
          </div>

          <form id="composer-form" class="composer">
            <textarea id="message-input" rows="1" placeholder="Write a message…" maxlength="1000"></textarea>
            <button type="submit" class="send-button">Send</button>
          </form>
        </div>
      </main>
    </div>

    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand-mark large">G</div>
          <h2>Private GroupChat</h2>
          <p>Approved school accounts only</p>
        </div>

        <form id="auth-form" class="auth-form">
          <label>
            <span>Email</span>
            <input id="email-input" type="email" placeholder="name@school.com" autocomplete="email" required />
          </label>

          <label>
            <span>Password</span>
            <input id="password-input" type="password" placeholder="Enter your password" autocomplete="current-password" required />
          </label>

          <button type="submit" class="primary-button">Continue</button>
        </form>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
